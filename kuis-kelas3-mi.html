<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuis Pintar Kelas 3 MI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff8e7;
    --card: #ffffff;
    --ink: #2d2a32;
    --muted: #6b6475;
    --primary: #2f9e6e;
    --primary-dark: #227a54;
    --accent: #ffb703;
    --benar: #2fbf71;
    --salah: #ef476f;
    --line: #f0e6cf;
    --shadow: 0 6px 0 rgba(0,0,0,.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Baloo 2", "Comic Sans MS", system-ui, sans-serif;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 10% 10%, #ffe8a3 0 60px, transparent 61px),
      radial-gradient(circle at 92% 18%, #c9f2dd 0 45px, transparent 46px),
      radial-gradient(circle at 85% 92%, #ffd6e0 0 70px, transparent 71px);
    color: var(--ink);
    min-height: 100vh;
    font-size: 18px;
    line-height: 1.4;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 40px; }
  .screen { display: none; animation: muncul .35s ease; }
  .screen.aktif { display: block; }
  @keyframes muncul { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .kartu {
    background: var(--card);
    border: 3px solid var(--line);
    border-radius: 24px;
    padding: 22px;
    box-shadow: var(--shadow);
  }
  h1 { font-size: clamp(28px, 6vw, 40px); margin: 0; line-height: 1.1; color: var(--primary-dark); }
  h2 { font-size: 24px; margin: 0 0 12px; }
  .sub { color: var(--muted); margin: 6px 0 0; }
  .header { text-align: center; margin-bottom: 18px; }
  .maskot { font-size: 56px; display: block; animation: goyang 2.4s ease-in-out infinite; }
  @keyframes goyang { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }

  label.judul { display: block; font-weight: 700; margin: 4px 0 8px; }
  input[type=text] {
    width: 100%; font: inherit; font-size: 20px;
    padding: 12px 16px; border-radius: 16px;
    border: 3px solid var(--line); outline: none; background: #fffdf7;
  }
  input[type=text]:focus { border-color: var(--accent); }

  .mapel-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 8px; }
  .mapel {
    font: inherit; cursor: pointer; text-align: center;
    border: 3px solid transparent; border-radius: 20px;
    padding: 14px 10px; color: var(--ink);
    box-shadow: var(--shadow); transition: transform .12s;
  }
  .mapel:hover { transform: translateY(-3px); }
  .mapel.dipilih { border-color: var(--ink); transform: translateY(-3px) scale(1.03); }
  .mapel .ikon { font-size: 36px; display: block; }
  .mapel b { display: block; font-size: 18px; }
  .mapel small { color: var(--muted); }

  .tombol {
    font: inherit; font-weight: 800; font-size: 20px; cursor: pointer;
    border: none; border-radius: 18px; padding: 14px 26px;
    background: var(--primary); color: #fff;
    box-shadow: 0 5px 0 var(--primary-dark);
    transition: transform .08s, box-shadow .08s;
  }
  .tombol:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--primary-dark); }
  .tombol:disabled { background: #b9c2bd; box-shadow: 0 5px 0 #98a29c; cursor: not-allowed; }
  .tombol.kuning { background: var(--accent); color: var(--ink); box-shadow: 0 5px 0 #d99a00; }
  .tombol.putih { background: #fff; color: var(--ink); border: 3px solid var(--line); box-shadow: 0 5px 0 var(--line); }
  .tengah { text-align: center; margin-top: 20px; }
  .link-reset { font: inherit; font-size: 15px; background: none; border: none; color: var(--muted); text-decoration: underline; cursor: pointer; }
  .info-putaran { display: none; background: #fff1b8; border: 3px solid var(--accent); border-radius: 16px; padding: 10px 14px; margin-bottom: 14px; font-weight: 700; }
  .pesan-error { color: var(--salah); font-weight: 700; min-height: 1.4em; margin-top: 10px; }

  /* Layar kuis */
  .bar-atas { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { background: #fff; border: 3px solid var(--line); border-radius: 999px; padding: 4px 14px; font-weight: 700; }
  .progress { height: 16px; background: #fff; border: 3px solid var(--line); border-radius: 999px; overflow: hidden; margin-bottom: 16px; }
  .progress > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--primary)); transition: width .4s; }
  .soal { font-size: clamp(20px, 4.5vw, 26px); font-weight: 700; margin: 0 0 16px; }
  .arab { font-family: "Amiri", "Traditional Arabic", serif; font-size: 1.5em; direction: rtl; unicode-bidi: isolate; }
  .opsi-list { display: grid; gap: 10px; }
  .opsi {
    font: inherit; font-size: 20px; text-align: left; cursor: pointer;
    display: flex; align-items: center; gap: 12px;
    background: #fffdf7; border: 3px solid var(--line); border-radius: 18px;
    padding: 10px 14px; color: var(--ink); transition: transform .1s, background .2s;
  }
  .opsi:hover:not(:disabled) { transform: translateX(4px); border-color: var(--accent); }
  .opsi .huruf {
    flex: none; width: 38px; height: 38px; border-radius: 12px;
    display: grid; place-items: center; font-weight: 800;
    background: var(--accent); color: var(--ink);
  }
  .opsi.benar { background: #dcf7e8; border-color: var(--benar); }
  .opsi.benar .huruf { background: var(--benar); color: #fff; }
  .opsi.salah { background: #ffe1e8; border-color: var(--salah); animation: geleng .35s; }
  .opsi.salah .huruf { background: var(--salah); color: #fff; }
  .opsi:disabled { cursor: default; }
  @keyframes geleng { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  .umpan { display: none; margin-top: 16px; padding: 14px 16px; border-radius: 18px; font-weight: 700; }
  .umpan.tampil { display: block; animation: muncul .3s; }
  .umpan.ok { background: #dcf7e8; color: #17603a; }
  .umpan.no { background: #ffe1e8; color: #8a1934; }
  .umpan p { margin: 4px 0 0; font-weight: 500; }

  /* Hasil */
  .bintang { font-size: 52px; letter-spacing: 6px; margin: 6px 0; }
  .skor-besar { font-size: 64px; font-weight: 800; color: var(--primary-dark); line-height: 1; }
  .ulasan { margin-top: 18px; text-align: left; }
  .ulasan details { background: #fffdf7; border: 3px solid var(--line); border-radius: 16px; padding: 10px 14px; }
  .ulasan summary { cursor: pointer; font-weight: 700; }
  .ulasan ol { padding-left: 22px; margin: 10px 0 0; }
  .ulasan li { margin-bottom: 10px; }
  .ulasan .jwb-salah { color: var(--salah); }
  .ulasan .jwb-benar { color: var(--primary-dark); font-weight: 700; }
  .baris-tombol { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
  footer { text-align: center; color: var(--muted); font-size: 14px; margin-top: 22px; }

  /* Konfeti */
  .konfeti { position: fixed; top: -20px; width: 10px; height: 14px; z-index: 50; pointer-events: none; animation: jatuh linear forwards; }
  @keyframes jatuh { to { transform: translateY(110vh) rotate(720deg); } }

  @media (max-width: 480px) {
    body { font-size: 17px; }
    .kartu { padding: 16px; border-radius: 20px; }
    .opsi { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- LAYAR 1: MULAI -->
  <section id="layarMulai" class="screen aktif">
    <div class="header">
      <span class="maskot" aria-hidden="true">🦉</span>
      <h1>Kuis Pintar Kelas 3 MI</h1>
      <p class="sub">Ayo belajar sambil bermain! Pilih pelajaran lalu jawab soalnya, ya.</p>
    </div>
    <div class="kartu">
      <label class="judul" for="namaSiswa">✏️ Siapa namamu?</label>
      <input id="namaSiswa" type="text" maxlength="30" placeholder="Tulis namamu di sini" autocomplete="off">

      <p class="judul" style="margin-top:18px">📚 Pilih pelajaran:</p>
      <div class="mapel-grid" id="daftarMapel"></div>

      <div class="pesan-error" id="pesanError" role="alert"></div>
      <div class="tengah">
        <button class="tombol" id="btnMulai">Mulai Kuis 🚀</button>
      </div>
      <div class="tengah" style="margin-top:12px">
        <button type="button" class="link-reset" id="btnReset" style="display:none">🗑️ Hapus riwayat soal untuk nama ini</button>
      </div>
    </div>
    <footer>Bismillah, semoga Allah memudahkan belajarmu 🤲</footer>
  </section>

  <!-- LAYAR 2: KUIS -->
  <section id="layarKuis" class="screen">
    <div class="bar-atas">
      <span class="chip" id="infoMapel">📚</span>
      <span class="chip" id="infoNomor">Soal 1/10</span>
      <span class="chip" id="infoSkor">⭐ 0</span>
    </div>
    <div class="progress" aria-hidden="true"><div id="barProgress"></div></div>
    <div class="info-putaran" id="infoPutaran" role="status"></div>
    <div class="kartu">
      <p class="soal" id="teksSoal"></p>
      <div class="opsi-list" id="daftarOpsi"></div>
      <div class="umpan" id="umpan" role="status" aria-live="polite"></div>
      <div class="tengah">
        <button class="tombol kuning" id="btnLanjut" style="display:none">Lanjut ➡️</button>
      </div>
    </div>
  </section>

  <!-- LAYAR 3: HASIL -->
  <section id="layarHasil" class="screen">
    <div class="kartu tengah" style="margin-top:0">
      <div style="font-size:64px" id="emojiHasil">🏆</div>
      <h2 id="judulHasil">Hebat!</h2>
      <div class="bintang" id="bintangHasil">⭐⭐⭐</div>
      <div class="skor-besar" id="skorHasil">100</div>
      <p class="sub" id="rincianHasil"></p>
      <p id="pesanHasil" style="font-weight:700"></p>
      <div class="ulasan" id="ulasan"></div>
      <div class="baris-tombol">
        <button class="tombol" id="btnUlang">Ulangi 🔄</button>
        <button class="tombol putih" id="btnGanti">Ganti Pelajaran 📚</button>
      </div>
    </div>
  </section>

</div>

function pg(t, benar, pengecoh, p) {
  const lain = acak([...new Set(pengecoh)].filter((x) => x !== benar)).slice(0, 3);
  return { t, o: [benar, ...lain], j: 0, p };
}

function opsiAngka(benar, akhiran = "") {

  return { o: [benar, ...[...new Set(calon)].slice(0, 3)].map((x) => fmt(x) + akhiran), j: 0 };
}

    }
    info = "🌟 MasyaAllah! Hampir semua soal pelajaran ini sudah kamu kerjakan. Beberapa soal lama muncul lagi untuk mengulang pelajaran.";
  }
  if (kode === "campur") hasil.forEach((s) => (s.ikon = BANK[s.kode].ikon));
  return { terpilih: acak(hasil), info };
}
function tandaiDijawab(id) {
  const r = bacaRiwayat(nama); r.add(id); simpanRiwayat(nama, r);
}
function jumlahDikerjakan(kode, n) {
  const r = [...bacaRiwayat(n)];
  return kode === "campur" ? r.length : r.filter((id) => id.startsWith(kode + "|")).length;
}

/* Suara sederhana (tanpa file) */
let ctx = null;
function bunyi(jenis) {
  try {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    const nada = jenis === "benar" ? [523, 659, 784] : jenis === "salah" ? [300, 220] : [523, 659, 784, 1047];
    nada.forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = jenis === "salah" ? "sawtooth" : "triangle";
      o.frequency.value = f;
      const t = ctx.currentTime + i * 0.12;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      o.connect(g).connect(ctx.destination);
      o.start(t); o.stop(t + 0.2);
    });
  } catch (e) { /* abaikan jika browser tidak mendukung */ }
}

function konfeti(n = 80) {
  const warna = ["#ffb703", "#2fbf71", "#ef476f", "#118ab2", "#8338ec"];
  for (let i = 0; i < n; i++) {
    const d = document.createElement("div");
    d.className = "konfeti";
    d.style.left = Math.random() * 100 + "vw";
    d.style.background = warna[i % warna.length];
    d.style.animationDuration = 1.8 + Math.random() * 1.8 + "s";
    d.style.animationDelay = Math.random() * 0.6 + "s";
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 4500);
  }
}

function tampilkan(id) {
  document.querySelectorAll(".screen").forEach((s) => s.classList.remove("aktif"));
  $(id).classList.add("aktif");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* Daftar mapel */
function buatDaftarMapel() {
  const semua = { ...BANK, campur: MODE_CAMPUR };
  const wadah = $("daftarMapel");
  Object.entries(semua).forEach(([kode, m]) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "mapel";
    b.style.background = m.warna;
    b.dataset.kode = kode;
    b.innerHTML = `<span class="ikon">${m.ikon}</span><b>${m.nama}</b><small></small>`;
    b.addEventListener("click", () => {
      document.querySelectorAll(".mapel").forEach((x) => x.classList.remove("dipilih"));
      b.classList.add("dipilih");
      pilihanMapel = kode;
      $("pesanError").textContent = "";
    });
    wadah.appendChild(b);
  });
  perbaruiInfoMapel();
}

/* Tulisan kecil di kartu pelajaran: berapa soal yang belum dikerjakan */
function perbaruiInfoMapel() {
  const n = $("namaSiswa").value.trim();
  document.querySelectorAll(".mapel").forEach((b) => {
    const kode = b.dataset.kode;
    let teks = "♾️ Soal selalu baru";
    if (n) {
      teks = `✅ ${jumlahDikerjakan(kode, n)} soal dikerjakan`;
      if (kode === "mtk") teks += ` • Level ${bacaLevel(n, "mtk")}`;
    }
    b.querySelector("small").textContent = teks;
  });
  $("btnReset").style.display = n && bacaRiwayat(n).size ? "inline" : "none";
}

function mulai() {
  nama = $("namaSiswa").value.trim();
  if (!nama) { $("pesanError").textContent = "Tulis namamu dulu, ya! 😊"; $("namaSiswa").focus(); return; }
  if (!pilihanMapel) { $("pesanError").textContent = "Pilih salah satu pelajaran dulu, ya! 📚"; return; }

  levelAktif = bacaLevel(nama, "mtk");
  const { terpilih, info } = pilihSoalBaru(pilihanMapel);
  $("infoPutaran").textContent = info;
  $("infoPutaran").style.display = info ? "block" : "none";
  soalAktif = terpilih.map((s) => {
    // acak urutan pilihan jawaban, tetap ingat yang benar
    const urut = acak(s.o.map((teks, i) => ({ teks, benar: i === s.j })));
    return { ...s, opsi: urut };
  });
  nomor = 0; skor = 0; catatan = [];
  const m = pilihanMapel === "campur" ? MODE_CAMPUR : BANK[pilihanMapel];
  $("infoMapel").textContent = m.ikon + " " + m.nama + (pilihanMapel === "mtk" ? " • Level " + levelAktif : "");
  tampilkan("layarKuis");
  tampilSoal();
}

function tampilSoal() {
  const s = soalAktif[nomor];
  $("infoNomor").textContent = `Soal ${nomor + 1}/${soalAktif.length}`;
  $("infoSkor").textContent = "⭐ " + skor;
  $("barProgress").style.width = (nomor / soalAktif.length) * 100 + "%";
  $("teksSoal").innerHTML = (s.ikon ? s.ikon + " " : "") + s.t;
  $("umpan").className = "umpan";
  $("btnLanjut").style.display = "none";

  const wadah = $("daftarOpsi");
  wadah.innerHTML = "";
  s.opsi.forEach((op, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "opsi";
    b.innerHTML = `<span class="huruf">${"ABCD"[i]}</span><span>${op.teks}</span>`;
    b.addEventListener("click", () => jawab(b, op));
    wadah.appendChild(b);
  });
}

function jawab(tombol, op) {
  const s = soalAktif[nomor];
  const semua = [...document.querySelectorAll(".opsi")];
  semua.forEach((b, i) => { b.disabled = true; if (s.opsi[i].benar) b.classList.add("benar"); });
  const u = $("umpan");
  const kunci = s.opsi.find((x) => x.benar).teks;
  if (op.benar) {
    skor++;
    bunyi("benar");
    const pujian = ["Benar! Hebat! 🎉", "MasyaAllah, benar! 🌟", "Pintar sekali! 👏", "Betul! Teruskan! 💪"];
    u.innerHTML = pujian[Math.floor(Math.random() * pujian.length)] + `<p>${s.p}</p>`;
    u.className = "umpan ok tampil";
  } else {
    tombol.classList.add("salah");
    bunyi("salah");
    u.innerHTML = `Belum tepat, jangan menyerah! 💖<p>Jawaban yang benar: <b>${kunci}</b>. ${s.p}</p>`;
    u.className = "umpan no tampil";
  }
  catatan.push({ soal: s.t, dipilih: op.teks, kunci, benar: op.benar });
  tandaiDijawab(s.id);
  $("infoSkor").textContent = "⭐ " + skor;
  const btn = $("btnLanjut");
  btn.textContent = nomor + 1 < soalAktif.length ? "Lanjut ➡️" : "Lihat Nilai 🏆";
  btn.style.display = "inline-block";
  btn.focus({ preventScroll: true });
}

function lanjut() {
  nomor++;
  if (nomor < soalAktif.length) tampilSoal();
  else selesai();
}

function selesai() {
  $("barProgress").style.width = "100%";
  const total = soalAktif.length;
  const nilai = Math.round((skor / total) * 100);
  let jmlBintang, emoji, judul, pesan;
  if (nilai >= 90)      { jmlBintang = 3; emoji = "🏆"; judul = "Luar Biasa, " + nama + "!"; pesan = "MasyaAllah, kamu hebat sekali! Pertahankan, ya!"; }
  else if (nilai >= 70) { jmlBintang = 2; emoji = "🥳"; judul = "Bagus, " + nama + "!"; pesan = "Hampir sempurna! Ayo coba lagi supaya dapat 3 bintang."; }
  else if (nilai >= 50) { jmlBintang = 1; emoji = "😊"; judul = "Cukup Baik, " + nama + "!"; pesan = "Terus belajar, kamu pasti bisa lebih baik!"; }
  else                  { jmlBintang = 0; emoji = "💪"; judul = "Semangat, " + nama + "!"; pesan = "Tidak apa-apa. Baca lagi materinya, lalu coba sekali lagi, ya!"; }

  // Level Matematika naik/turun mengikuti nilai, supaya anak terus tertantang
  if (pilihanMapel === "mtk") {
    const lama = levelAktif, baru = nilai >= 80 ? Math.min(3, lama + 1) : nilai < 50 ? Math.max(1, lama - 1) : lama;
    simpanLevel(nama, "mtk", baru);
    if (baru > lama) pesan += ` 🚀 Kamu naik ke Level ${baru}! Soal berikutnya lebih menantang.`;
    else if (baru < lama) pesan += ` Kita latihan lagi di Level ${baru} dulu, ya.`;
    else if (lama === 3 && nilai >= 80) pesan += " 👑 Kamu sudah di level tertinggi!";
  }
  $("emojiHasil").textContent = emoji;
  $("judulHasil").textContent = judul;
  $("bintangHasil").textContent = "⭐".repeat(jmlBintang) + "☆".repeat(3 - jmlBintang);
  $("skorHasil").textContent = nilai;
  $("rincianHasil").textContent = `Benar ${skor} dari ${total} soal`;
  $("pesanHasil").textContent = pesan;

  const salah = catatan.filter((c) => !c.benar);
  $("ulasan").innerHTML = salah.length === 0
    ? `<p class="tengah" style="font-weight:700">Semua jawabanmu benar! 🎉</p>`
    : `<details><summary>📝 Lihat pembahasan soal yang salah (${salah.length})</summary><ol>` +
      salah.map((c) => `<li>${c.soal}<br><span class="jwb-salah">✗ Jawabanmu: ${c.dipilih}</span><br><span class="jwb-benar">✓ Jawaban benar: ${c.kunci}</span></li>`).join("") +
      `</ol></details>`;

  tampilkan("layarHasil");
  bunyi("selesai");
  if (nilai >= 70) konfeti();
}

$("btnMulai").addEventListener("click", mulai);
$("namaSiswa").addEventListener("keydown", (e) => { if (e.key === "Enter") mulai(); });
$("btnLanjut").addEventListener("click", lanjut);
$("btnUlang").addEventListener("click", mulai);
$("btnGanti").addEventListener("click", () => { perbaruiInfoMapel(); tampilkan("layarMulai"); });
$("namaSiswa").addEventListener("input", perbaruiInfoMapel);
$("btnReset").addEventListener("click", () => {
  const n = $("namaSiswa").value.trim();
  if (n && confirm(`Hapus riwayat soal untuk "${n}"? Semua soal akan dianggap baru lagi.`)) {
    simpanRiwayat(n, new Set());
    perbaruiInfoMapel();
  }
});
buatDaftarMapel();
</script>
