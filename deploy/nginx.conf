server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Halaman utama diarahkan ke kuis
    location = / { return 302 /kuistes/; }
    location = /kuistes { return 301 /kuistes/; }

    location /kuistes/ {
        try_files $uri $uri/ /kuistes/index.html;
        add_header Cache-Control "no-cache";
    }
}
